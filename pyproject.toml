[project]
name = "agilex-sdk-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyagxarm",
    "pyzmq>=27.0",
    "python-can>=4.6.1",
]

[project.scripts]
agilex-sdk-python = "agilex_sdk_python.cli:main"
agilex-sdk-python-server = "agilex_sdk_python.gello_server:main"
ag = "agilex_sdk_python.cli:main"
ag-gello-server = "agilex_sdk_python.gello_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv.sources]
pyagxarm = { git = "https://github.com/agilexrobotics/pyAgxArm.git" }

[tool.pyright]
venvPath = "."
venv = ".venv"
